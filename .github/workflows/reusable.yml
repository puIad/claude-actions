# Called by the stub that sync.yml installs in every repo.
# Each job tries the Pro token first; the Team token runs only if the Pro run failed (usage limit, expired token).
name: Claude

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN_TEAM:
        required: false

jobs:
  review:
    # Fork PRs get no secrets, so only same-repo PRs. Drafts wait for ready_for_review.
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PROMPT: |
        REPO: ${{ github.repository }}
        PR NUMBER: ${{ github.event.pull_request.number }}

        Review this pull request. First run `gh pr diff ${{ github.event.pull_request.number }}` on its own (no pipes):
        only the changes in that diff are under review. The PR branch is checked out in the working directory,
        so read surrounding files for context. If the repo has a CLAUDE.md or AGENTS.md, read it and judge the
        change against the project's intent.
        Report only real problems: bugs, security holes, data loss, broken callers, missing error handling.
        Skip style nits and anything you are not confident is wrong.
        Put each problem on its line with mcp__github_inline_comment__create_inline_comment (confirmed: true).
        Finish with one short `gh pr comment` summary. If you found nothing, say so in one line.
      TOOLS: --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: pro
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ env.PROMPT }}
          claude_args: ${{ env.TOOLS }}      - name: Retry with Team account
        if: steps.pro.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_TEAM }}
          github_token: ${{ github.token }}
          prompt: ${{ env.PROMPT }}
          claude_args: ${{ env.TOOLS }}

  mention:
    # "@claude ..." in a PR or issue comment. The action itself ignores commenters without write access.
    if: >-
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: pro
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
      - name: Retry with Team account
        if: steps.pro.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_TEAM }}
          github_token: ${{ github.token }}
